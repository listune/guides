<script data-cfasync="false">
  (function() {
    function enforceDark() {
      if (document.documentElement) {
        document.documentElement.classList.remove('light');
        if (!document.documentElement.classList.contains('dark')) {
          document.documentElement.classList.add('dark');
        }
      }
      try {
        localStorage.setItem('retype_scheme', 'dark');
      } catch (e) {}

      var btn = document.getElementById('retype-scheme-button');
      if (btn && btn.parentNode) {
        btn.parentNode.removeChild(btn);
      }
      var sw = document.querySelector('doc-theme-switch');
      if (sw && sw.parentNode) {
        sw.parentNode.removeChild(sw);
      }
      var menus = document.querySelectorAll('.scheme-menu, .scheme-menu-item');
      for (var i = 0; i < menus.length; i++) {
        if (menus[i].parentNode) menus[i].parentNode.removeChild(menus[i]);
      }
    }

    enforceDark();
    document.addEventListener('DOMContentLoaded', enforceDark);
    window.addEventListener('load', enforceDark);

    if (window.MutationObserver) {
      var observer = new MutationObserver(function() {
        enforceDark();
      });
      observer.observe(document.documentElement, { childList: true, subtree: true });
    }
  })();
</script>
